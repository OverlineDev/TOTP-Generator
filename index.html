<body>

<div class="container">
    <div class="card">
        <h2>TOTP Authenticator</h2>
        <div class="subtitle">Your codes are generated locally in your browser.</div>

        <div id="accounts" class="accounts"></div>

        <div class="toolbar">
            <button class="primary" onclick="openAddAccount()">+ Add Account</button>
            <button onclick="exportBackup()">Export Backup</button>
            <button onclick="document.getElementById('importFile').click()">Import Backup</button>
        </div>

        <input
            id="importFile"
            type="file"
            accept=".json,application/json"
            style="display:none"
            onchange="importBackup(event)"
        >

        <div id="message" class="message"></div>
    </div>
</div>

<div id="modalBackdrop" class="modal-backdrop">
    <div class="modal">
        <h3 id="modalTitle">Add Account</h3>

        <label for="accountName">Account Name</label>
        <input
            id="accountName"
            type="text"
            placeholder="GitHub"
            autocomplete="off"
        >

        <label for="accountKey">TOTP Secret Key</label>
        <input
            id="accountKey"
            type="text"
            placeholder="JBSWY3DPEHPK3PXP"
            autocomplete="off"
            spellcheck="false"
        >

        <label for="accountNotes">Notes</label>
        <textarea
            id="accountNotes"
            placeholder="Optional notes"
        ></textarea>

        <div class="modal-actions">
            <button onclick="closeModal()">Cancel</button>
            <button class="primary" onclick="saveAccount()">Save</button>
        </div>
    </div>
</div>

<script>
/*
 * TOTP GENERATOR
 * Based on RFC 6238 / RFC 4226
 */

function base32Decode(input) {
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
    let bits = "";
    let output = [];

    input = input
        .replace(/\s/g, "")
        .replace(/=+$/, "")
        .toUpperCase();

    for (let char of input) {
        const val = alphabet.indexOf(char);

        if (val === -1) {
            throw new Error("Invalid Base32 character.");
        }

        bits += val.toString(2).padStart(5, "0");
    }

    for (let i = 0; i + 8 <= bits.length; i += 8) {
        output.push(parseInt(bits.substring(i, i + 8), 2));
    }

    return new Uint8Array(output);
}

async function generateTOTP(secret) {
    if (!secret) return "------";

    const key = base32Decode(secret);

    if (key.length === 0) {
        throw new Error("Invalid secret key.");
    }

    const epoch = Math.floor(Date.now() / 1000);
    const counter = Math.floor(epoch / 30);

    const buffer = new ArrayBuffer(8);
    const view = new DataView(buffer);

    view.setUint32(4, counter);

    const cryptoKey = await crypto.subtle.importKey(
        "raw",
        key,
        {
            name: "HMAC",
            hash: "SHA-1"
        },
        false,
        ["sign"]
    );

    const hmac = new Uint8Array(
        await crypto.subtle.sign("HMAC", cryptoKey, buffer)
    );

    const offset = hmac[hmac.length - 1] & 0x0f;

    const binary =
        ((hmac[offset] & 0x7f) << 24) |
        ((hmac[offset + 1] & 0xff) << 16) |
        ((hmac[offset + 2] & 0xff) << 8) |
        (hmac[offset + 3] & 0xff);

    return (binary % 1000000)
        .toString()
        .padStart(6, "0");
}


/*
 * ACCOUNT SYSTEM
 */

let accounts = [];
let editingIndex = null;

function openAddAccount() {
    editingIndex = null;

    document.getElementById("modalTitle").textContent = "Add Account";
    document.getElementById("accountName").value = "";
    document.getElementById("accountKey").value = "";
    document.getElementById("accountNotes").value = "";

    document.getElementById("modalBackdrop").classList.add("show");

    setTimeout(() => {
        document.getElementById("accountName").focus();
    }, 50);
}

function openEditAccount(index) {
    const account = accounts[index];

    if (!account) return;

    editingIndex = index;

    document.getElementById("modalTitle").textContent = "Edit Account";
    document.getElementById("accountName").value = account.name;
    document.getElementById("accountKey").value = account.key;
    document.getElementById("accountNotes").value = account.notes;

    document.getElementById("modalBackdrop").classList.add("show");

    setTimeout(() => {
        document.getElementById("accountName").focus();
    }, 50);
}

function closeModal() {
    document.getElementById("modalBackdrop").classList.remove("show");
    editingIndex = null;
}

function saveAccount() {
    const name = document.getElementById("accountName").value.trim();
    const key = document.getElementById("accountKey").value
        .replace(/\s/g, "")
        .trim()
        .toUpperCase();

    const notes = document.getElementById("accountNotes").value.trim();

    if (!name) {
        showMessage("Please enter an account name.");
        return;
    }

    if (!key) {
        showMessage("Please enter a TOTP secret key.");
        return;
    }

    try {
        const decoded = base32Decode(key);

        if (decoded.length === 0) {
            throw new Error();
        }
    } catch {
        showMessage("That does not appear to be a valid Base32 secret.");
        return;
    }

    const account = {
        name,
        key,
        notes
    };

    if (editingIndex === null) {
        accounts.push(account);
    } else {
        accounts[editingIndex] = account;
    }

    closeModal();
    renderAccounts();
}

function deleteAccount(index) {
    const account = accounts[index];

    if (!account) return;

    const confirmed = confirm(
        `Delete "${account.name}"?\n\nThis cannot be undone unless you have a backup.`
    );

    if (!confirmed) return;

    accounts.splice(index, 1);
    renderAccounts();
}


/*
 * DISPLAY ACCOUNTS
 */

function renderAccounts() {
    const container = document.getElementById("accounts");

    container.innerHTML = "";

    if (accounts.length === 0) {
        container.innerHTML = `
            <div class="empty">
                No accounts yet.<br>
                Add an account to get started.
            </div>
        `;

        return;
    }

    accounts.forEach((account, index) => {
        const card = document.createElement("div");
        card.className = "account";

        const header = document.createElement("div");
        header.className = "account-header";

        const info = document.createElement("div");

        const name = document.createElement("div");
        name.className = "account-name";
        name.textContent = account.name;

        info.appendChild(name);

        if (account.notes) {
            const notes = document.createElement("div");
            notes.className = "account-notes";
            notes.textContent = account.notes;
            info.appendChild(notes);
        }

        header.appendChild(info);

        const code = document.createElement("div");
        code.className = "code";
        code.id = `code-${index}`;
        code.textContent = "------";

        const ring = document.createElement("div");
        ring.className = "ring";

        const timer = document.createElement("div");
        timer.className = "timer";
        timer.id = `timer-${index}`;
        timer.textContent = "Next code in: --";

        const actions = document.createElement("div");
        actions.className = "actions";

        const copyButton = document.createElement("button");
        copyButton.textContent = "Copy";
        copyButton.onclick = () => copyCode(index);

        const editButton = document.createElement("button");
        editButton.textContent = "Edit";
        editButton.onclick = () => openEditAccount(index);

        const deleteButton = document.createElement("button");
        deleteButton.className = "danger";
        deleteButton.textContent = "Delete";
        deleteButton.onclick = () => deleteAccount(index);

        actions.appendChild(copyButton);
        actions.appendChild(editButton);
        actions.appendChild(deleteButton);

        card.appendChild(header);
        card.appendChild(code);
        card.appendChild(ring);
        card.appendChild(timer);
        card.appendChild(actions);

        container.appendChild(card);
    });

    update();
}


/*
 * TOTP UPDATES
 */

async function update() {
    const epoch = Math.floor(Date.now() / 1000);
    const remaining = 30 - (epoch % 30);

    for (let i = 0; i < accounts.length; i++) {
        const account = accounts[i];
        const codeEl = document.getElementById(`code-${i}`);
        const timerEl = document.getElementById(`timer-${i}`);

        if (!codeEl || !timerEl) continue;

        try {
            const newCode = await generateTOTP(account.key);

            if (codeEl.textContent !== newCode) {
                codeEl.style.opacity = 0;
                codeEl.style.transform = "scale(0.9)";

                setTimeout(() => {
                    if (!document.body.contains(codeEl)) return;

                    codeEl.textContent = newCode;
                    codeEl.style.opacity = 1;
                    codeEl.style.transform = "scale(1)";
                }, 150);
            }

            timerEl.textContent = "Next code in: " + remaining;
        } catch {
            codeEl.textContent = "ERROR";
            timerEl.textContent = "Invalid secret key";
        }
    }
}


/*
 * COPY
 */

async function copyCode(index) {
    const account = accounts[index];

    if (!account) return;

    try {
        const code = await generateTOTP(account.key);

        await navigator.clipboard.writeText(code);

        showMessage(`Copied ${account.name}'s code.`);

        /*
         * Clear the clipboard after 30 seconds if possible.
         * This only affects the clipboard entry created by this app.
         */
        setTimeout(async () => {
            try {
                const currentClipboard = await navigator.clipboard.readText();

                if (currentClipboard === code) {
                    await navigator.clipboard.writeText("");
                }
            } catch {
                // Clipboard permissions may prevent this.
            }
        }, 30000);

    } catch {
        showMessage("Unable to copy the code.");
    }
}


/*
 * BACKUPS
 */

function exportBackup() {
    if (accounts.length === 0) {
        showMessage("There are no accounts to export.");
        return;
    }

    const backup = {
        app: "TOTP Generator",
        version: "1.1.0",
        readonly: true,
        accounts: accounts.map(account => ({
            name: account.name,
            key: account.key,
            notes: account.notes
        }))
    };

    const json = JSON.stringify(backup, null, 4);

    const blob = new Blob(
        [json],
        { type: "application/json" }
    );

    const url = URL.createObjectURL(blob);

    const link = document.createElement("a");
    link.href = url;
    link.download = "totp-backup.json";

    document.body.appendChild(link);
    link.click();
    link.remove();

    URL.revokeObjectURL(url);

    showMessage("Backup exported.");
}

function importBackup(event) {
    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = () => {
        try {
            const backup = JSON.parse(reader.result);

            if (!backup || typeof backup !== "object") {
                throw new Error("Invalid backup.");
            }

            if (!Array.isArray(backup.accounts)) {
                throw new Error("Backup does not contain accounts.");
            }

            const importedAccounts = backup.accounts.map(account => {
                if (!account || typeof account !== "object") {
                    throw new Error("Invalid account.");
                }

                if (
                    typeof account.name !== "string" ||
                    typeof account.key !== "string" ||
                    typeof account.notes !== "string"
                ) {
                    throw new Error("Invalid account format.");
                }

                const key = account.key
                    .replace(/\s/g, "")
                    .trim()
                    .toUpperCase();

                const decoded = base32Decode(key);

                if (!key || decoded.length === 0) {
                    throw new Error("Invalid Base32 key.");
                }

                return {
                    name: account.name.trim(),
                    key,
                    notes: account.notes.trim()
                };
            });

            const replace = confirm(
                "Import this backup?\n\n" +
                "OK = Replace your current accounts\n" +
                "Cancel = Keep your current accounts"
            );

            if (replace) {
                accounts = importedAccounts;
            } else {
                accounts = accounts.concat(importedAccounts);
            }

            renderAccounts();

            showMessage(
                `${importedAccounts.length} account(s) imported.`
            );

        } catch (error) {
            showMessage(
                "Could not import backup. Make sure it is a valid TOTP Generator backup."
            );
        }

        event.target.value = "";
    };

    reader.onerror = () => {
        showMessage("Could not read the backup file.");
        event.target.value = "";
    };

    reader.readAsText(file);
}


/*
 * MESSAGES
 */

let messageTimeout;

function showMessage(text) {
    const message = document.getElementById("message");

    message.textContent = text;
    message.classList.add("show");

    clearTimeout(messageTimeout);

    messageTimeout = setTimeout(() => {
        message.classList.remove("show");
    }, 3500);
}


/*
 * CLOSE MODAL WHEN CLICKING OUTSIDE
 */

document.getElementById("modalBackdrop").addEventListener("click", event => {
    if (event.target === event.currentTarget) {
        closeModal();
    }
});


/*
 * START
 */

renderAccounts();
setInterval(update, 500);
update();
</script>

<footer>
    <a href="https://github.com/overlinedev/totp-generator">
        Click here to view code for this repo
    </a>
</footer>

</body>
</html>
