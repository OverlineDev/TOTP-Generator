<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>TOTP Authenticator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: system-ui;
      padding: 20px;
    }
    .card {
      background: rgba(255,255,255,0.08);
      padding: 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      backdrop-filter: blur(10px);
    }
    input {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.15);
      color: white;
    }
    button {
      margin-top: 10px;
      padding: 10px 15px;
      border: none;
      border-radius: 8px;
      background: #38bdf8;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1>TOTP Authenticator</h1>

<div id="auth"></div>
<div id="app" style="display:none;"></div>

<script type="module">
  import { supabase, signup, login, getUserSalt, saveEncryptedSecret, fetchEncryptedSecrets, deleteEntry } from "./lib/supabase.js";
  import { generateSaltBase64, deriveKeyFromPassword, encryptSecret, decryptSecret } from "./lib/crypto.js";
  import { generateTOTP } from "./lib/totp.js";

  let aesKey = null;

  function renderAuth() {
    document.getElementById("auth").innerHTML = `
      <div class="card">
        <h2>Login</h2>
        <input id="email" placeholder="Email">
        <input id="password" placeholder="Password" type="password">
        <button id="loginBtn">Login</button>
        <button id="signupBtn">Sign Up</button>
      </div>
    `;

    document.getElementById("loginBtn").onclick = handleLogin;
    document.getElementById("signupBtn").onclick = handleSignup;
  }

  async function handleSignup() {
    const email = email.value;
    const password = password.value;

    const salt = generateSaltBase64();
    await signup(email, password, salt);

    alert("Signup complete. Now log in.");
  }

  async function handleLogin() {
    const email = email.value;
    const password = password.value;

    const { error } = await login(email, password);
    if (error) return alert(error.message);

    const salt = await getUserSalt();
    aesKey = await deriveKeyFromPassword(password, salt);

    document.getElementById("auth").style.display = "none";
    document.getElementById("app").style.display = "block";

    loadEntries();
  }

  async function loadEntries() {
    const { data } = await fetchEncryptedSecrets();

    let html = `
      <div class="card">
        <h2>Create New Entry</h2>
        <input id="entryName" placeholder="Name (GitHub, Google...)">
        <input id="entrySecret" placeholder="Base32 Secret">
        <button id="createBtn">Create</button>
      </div>
    `;

    for (let row of data) {
      const secret = await decryptSecret(row.secret_encrypted, aesKey);
      const code = await generateTOTP(secret);

      html += `
        <div class="card">
          <h3>${row.name}</h3>
          <div style="font-size:32px;font-weight:bold;">${code}</div>
          <button onclick="deleteEntry('${row.id}')">Delete</button>
        </div>
      `;
    }

    document.getElementById("app").innerHTML = html;

    document.getElementById("createBtn").onclick = async () => {
      const name = entryName.value;
      const secret = entrySecret.value;

      const encrypted = await encryptSecret(secret, aesKey);
      await saveEncryptedSecret(name, encrypted);

      loadEntries();
    };
  }

  renderAuth();
</script>

</body>
</html>
