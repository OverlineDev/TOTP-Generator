<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TOTP Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        font-family: system-ui, sans-serif;
        background: #f3f4f6;
        margin: 0;
        padding: 0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .card {
        background: white;
        padding: 30px;
        width: 350px;
        border-radius: 16px;
        box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        text-align: center;
    }

    h2 {
        margin-top: 0;
        font-weight: 600;
    }

    input {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border-radius: 8px;
        border: 1px solid #ccc;
        margin-top: 10px;
    }

    #code {
        font-size: 48px;
        font-weight: bold;
        margin-top: 25px;
        letter-spacing: 4px;
        transition: opacity 0.3s ease;
    }

    .timer-ring {
        width: 60px;
        height: 60px;
        margin: 15px auto 0;
        border-radius: 50%;
        border: 6px solid #e5e7eb;
        border-top-color: #3b82f6;
        animation: spin 30s linear infinite;
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    #timer {
        margin-top: 10px;
        color: #555;
    }
</style>
</head>
<body>

<div class="card">
    <h2>TOTP Generator</h2>
    <input id="secret" placeholder="Enter Base32 Secret">

    <div id="code">------</div>
    <div class="timer-ring"></div>
    <div id="timer">Next code in: --</div>
</div>

<script>
function base32Decode(input) {
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
    let bits = "";
    let output = [];

    input = input.replace(/=+$/, "").toUpperCase();

    for (let char of input) {
        const val = alphabet.indexOf(char);
        if (val === -1) continue;
        bits += val.toString(2).padStart(5, "0");
    }

    for (let i = 0; i + 8 <= bits.length; i += 8) {
        output.push(parseInt(bits.substring(i, i + 8), 2));
    }

    return new Uint8Array(output);
}

async function generateTOTP(secret) {
    if (!secret) return "------";

    const key = base32Decode(secret);
    const epoch = Math.floor(Date.now() / 1000);
    const counter = Math.floor(epoch / 30);

    const buffer = new ArrayBuffer(8);
    const view = new DataView(buffer);
    view.setUint32(4, counter);

    const cryptoKey = await crypto.subtle.importKey(
        "raw", key, { name: "HMAC", hash: "SHA-1" }, false, ["sign"]
    );

    const hmac = new Uint8Array(await crypto.subtle.sign("HMAC", cryptoKey, buffer));
    const offset = hmac[hmac.length - 1] & 0x0f;

    const binary =
        ((hmac[offset] & 0x7f) << 24) |
        ((hmac[offset + 1] & 0xff) << 16) |
        ((hmac[offset + 2] & 0xff) << 8) |
        (hmac[offset + 3] & 0xff);

    return (binary % 1_000_000).toString().padStart(6, "0");
}

    const secret = document.getElementById("secret").value.trim();
    const codeEl = document.getElementById("code");

    const newCode = await generateTOTP(secret);
