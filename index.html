<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TOTP Generator</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: linear-gradient(135deg, #1e293b, #0f172a);
        font-family: system-ui, sans-serif;
        color: white;
    }

    .card {
        width: 360px;
        padding: 30px;
        border-radius: 20px;
        backdrop-filter: blur(20px);
        background: rgba(255, 255, 255, 0.08);
        box-shadow: 0 8px 30px rgba(0,0,0,0.4);
        text-align: center;
        border: 1px solid rgba(255,255,255,0.15);
    }

    h2 {
        margin-top: 0;
        font-weight: 600;
        letter-spacing: 1px;
    }

    input {
        width: 100%;
        padding: 12px;
        font-size: 16px;
        border-radius: 10px;
        border: none;
        margin-top: 10px;
        outline: none;
        background: rgba(255,255,255,0.15);
        color: white;
    }

    #code {
        font-size: 52px;
        font-weight: bold;
        margin-top: 25px;
        letter-spacing: 6px;
        transition: opacity 0.3s ease, transform 0.3s ease;
        text-shadow: 0 0 12px rgba(0, 200, 255, 0.7);
    }

    .ring {
        width: 80px;
        height: 80px;
        margin: 20px auto 0;
        border-radius: 50%;
        border: 6px solid rgba(255,255,255,0.15);
        position: relative;
    }

    .ring::after {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 6px solid transparent;
        border-top-color: #38bdf8;
        animation: spin 30s linear infinite;
    }

    @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
    }

    #timer {
        margin-top: 10px;
        color: #cbd5e1;
        font-size: 14px;
    }
</style>
</head>
<body>

<div class="card">
    <h2>TOTP Generator</h2>
    <input id="secret" placeholder="Enter Two-Factor Secret Setup Key here">

    <div id="code">------</div>
    <div class="ring"></div>
    <div id="timer">Next code in: --</div>
</div>

<script>
function base32Decode(input) {
    const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
    let bits = "";
    let output = [];

    input = input.replace(/=+$/, "").toUpperCase();

    for (let char of input) {
        const val = alphabet.indexOf(char);
        if (val === -1) continue;
        bits += val.toString(2).padStart(5, "0");
    }

    for (let i = 0; i + 8 <= bits.length; i += 8) {
        output.push(parseInt(bits.substring(i, i + 8), 2));
    }

    return new Uint8Array(output);
}

async function generateTOTP(secret) {
    if (!secret) return "------";

    const key = base32Decode(secret);
    const epoch = Math.floor(Date.now() / 1000);
    const counter = Math.floor(epoch / 30);

    const buffer = new ArrayBuffer(8);
    const view = new DataView(buffer);
    view.setUint32(4, counter);

    const cryptoKey = await crypto.subtle.importKey(
        "raw", key, { name: "HMAC", hash: "SHA-1" }, false, ["sign"]
    );

    const hmac = new Uint8Array(await crypto.subtle.sign("HMAC", cryptoKey, buffer));
    const offset = hmac[hmac.length - 1] & 0x0f;

    const binary =
        ((hmac[offset] & 0x7f) << 24) |
        ((hmac[offset + 1] & 0xff) << 16) |
        ((hmac[offset + 2] & 0xff) << 8) |
        (hmac[offset + 3] & 0xff);

    return (binary % 1_000_000).toString().padStart(6, "0");
}

async function update() {
    const secret = document.getElementById("secret").value.trim();
    const codeEl = document.getElementById("code");

    const newCode = await generateTOTP(secret);

    if (codeEl.textContent !== newCode) {
        codeEl.style.opacity = 0;
        codeEl.style.transform = "scale(0.9)";
        setTimeout(() => {
            codeEl.textContent = newCode;
            codeEl.style.opacity = 1;
            codeEl.style.transform = "scale(1)";
        }, 150);
    }

    const epoch = Math.floor(Date.now() / 1000);
    const remaining = 30 - (epoch % 30);
    document.getElementById("timer").textContent = "Next code in: " + remaining;
}

setInterval(update, 500);
</script>

<a href="https://github.com/overlinedev/totp-generator">Click here to view code for this repo</a>
    </footer>


</body>
</html>
